name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl

      - name: Restore Quicklisp cache
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}

      - name: Install Quicklisp
        run: |
          curl -fsSL -o quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path "~/quicklisp")' \
            --eval '(quit)'

      - name: Install Lisp dependencies
        run: |
          sbcl --non-interactive --load ~/quicklisp/setup.lisp \
            --eval '(ql:quickload "3bmd")' \
            --eval '(ql:quickload "3bmd-ext-code-blocks")' \
            --eval '(ql:quickload "3bmd-ext-tables")' \
            --eval '(ql:quickload "spinneret")' \
            --eval '(ql:quickload "hunchentoot")' \
            --eval '(quit)'

      - name: Register project with ASDF
        run: mkdir -p ~/common-lisp && ln -sfn "$PWD" ~/common-lisp/game-launcher-docs

      - name: Build static site
        run: make build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
